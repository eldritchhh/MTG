name: Test

# A ogni push e pull request: tipi, test della logica (Vitest) e script SQL su un Postgres usa e getta.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipi e build
        run: npm run build
      - name: Test della logica
        run: npm test
        env:
          TZ: Europe/Rome

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Script SQL (installazione, migrazione, permessi, rieseguibilità)
        run: bash scripts/test-sql.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
