name: APK di prova (branch pods)

# APK "MTG (test)" dal branch pods: altro identificativo, quindi si installa ACCANTO all'app vera,
# e usa il database di prova (Variables dell'environment "test-env"). Pubblicato come pre-release test-N:
# non è "latest" e l'app vera non lo propone come aggiornamento.
on:
  push:
    branches: [pods]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    environment: test-env
    steps:
      - uses: actions/checkout@v4

      - name: Chiave di firma presente?
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"; else echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web app (database di prova)
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY nelle Variables dell'environment test-env."
            exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # la versione di prova controlla solo le pre-release test-N (mai le versioni vere apk-N)
          VITE_APP_VERSION: test-${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}

      - name: Progetto Android "MTG (test)"
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId+='.test';c.appName='MTG (test)';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          node scripts/android-theme.mjs
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#3a1d1d" --iconBackgroundColorDark "#3a1d1d" \
            --splashBackgroundColor "#0e0c14" --splashBackgroundColorDark "#0e0c14"
          npx cap sync android

      - name: APK firmato
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mtg.keystore"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/mtg.keystore" --ks-key-alias mtg \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out ../mtg-test.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs ../mtg-test.apk

      - name: APK di debug (senza chiave di firma)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mtg-test.apk

      - name: Pubblica come pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: TEST ${{ github.run_number }} (branch pods)
          body: Versione di PROVA dal branch pods (${{ github.sha }}), con il database di prova. Si installa accanto all'app vera.
          files: mtg-test.apk
          prerelease: true
          make_latest: false
