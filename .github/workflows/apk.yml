name: APK Android

# Costruisce l'APK a ogni push su main (o a mano da Actions > APK Android > Run workflow)
# e lo pubblica come Release: dal telefono apri la pagina Releases del repo e scarichi il file .apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # Variables e Secrets sono salvati nell'environment "env" (Settings → Environments)
    environment: env
    steps:
      - uses: actions/checkout@v4

      - name: Chiave di firma presente?
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"; else echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web app
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY nelle Variables: l'APK funzionerebbe solo in locale."
            exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # versione mostrata nell'app = nome della Release (apk-N): serve al controllo aggiornamenti
          VITE_APP_VERSION: apk-${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}

      - name: Progetto Android (Capacitor)
        run: |
          npx cap add android
          # icona e splash dal logo (assets/logo.png, si rigenera con: node scripts/build-icons.mjs)
          npx capacitor-assets generate --android \
            --iconBackgroundColor "#0e0c14" --iconBackgroundColorDark "#0e0c14" \
            --splashBackgroundColor "#0e0c14" --splashBackgroundColorDark "#0e0c14"
          npx cap sync android

      # Se hai salvato una chiave di firma nei Secrets l'APK è firmato sempre uguale
      # e i telefoni possono aggiornare l'app senza disinstallarla (vedi README).
      - name: APK firmato
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        # apksigner (non jarsigner): Android 11+ rifiuta gli APK senza firma v2 ("App non installata")
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mtg.keystore"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/mtg.keystore" --ks-key-alias mtg \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out ../mtg-tra-amici.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs ../mtg-tra-amici.apk

      - name: APK di debug (senza chiave di firma)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mtg-tra-amici.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mtg-tra-amici-apk
          path: mtg-tra-amici.apk

      - name: Pubblica come Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          body: APK costruito da ${{ github.sha }}. Sul telefono scarica mtg-tra-amici.apk e aprilo.
          files: mtg-tra-amici.apk
          make_latest: true
