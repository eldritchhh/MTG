name: Deploy su GitHub Pages

# Versione web dell'app (per iPhone: Safari → Condividi → Aggiungi a Home) a ogni push su main.
# Parte da sola quando GitHub Pages è attivo (Settings → Pages → Source: GitHub Actions); altrimenti si salta.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = 200 ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages non è attivo (Settings → Pages → Source: GitHub Actions): niente sito"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # stesso database dell'APK (environment test-env, vedi apk.yml)
    environment: test-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # numero della versione web nel service worker (svuota la cache vecchia a ogni pubblicazione)
          VITE_WEB_BUILD: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
